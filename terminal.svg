<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Terminal animada — mateo.castro.dev</title>
<desc>Simulación de terminal con efecto typewriter y glitch para perfil de GitHub</desc>

<style>
  .bg { fill: #0a0a0a; }
  .topbar { fill: #1a1a1a; }
  .dot-r { fill: #ff5f56; }
  .dot-y { fill: #ffbd2e; }
  .dot-g { fill: #27c93f; }
  .bar-label { fill: #555; font-family: 'Courier New', monospace; font-size: 12px; }
  .g { fill: #00ff88; font-family: 'Courier New', monospace; font-size: 14px; }
  .w { fill: #e0e0e0; font-family: 'Courier New', monospace; font-size: 14px; }
  .c { fill: #00e5be; font-family: 'Courier New', monospace; font-size: 14px; }
  .d { fill: #00aa55; font-family: 'Courier New', monospace; font-size: 14px; }
  .ok { fill: #27c93f; font-family: 'Courier New', monospace; font-size: 14px; }

  .cursor {
    fill: #00ff88;
    animation: blink 1s step-end infinite;
    animation-delay: 4.6s;
    opacity: 0;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .l1  { animation: reveal 0s 0.1s forwards; opacity:0; }
  .l2  { animation: reveal 0s 0.7s forwards; opacity:0; }
  .l3  { animation: reveal 0s 1.1s forwards; opacity:0; }
  .l4  { animation: reveal 0s 1.2s forwards; opacity:0; }
  .l5  { animation: reveal 0s 1.8s forwards; opacity:0; }
  .l6  { animation: reveal 0s 2.1s forwards; opacity:0; }
  .l7  { animation: reveal 0s 2.3s forwards; opacity:0; }
  .l8  { animation: reveal 0s 2.4s forwards; opacity:0; }
  .l9  { animation: reveal 0s 3.0s forwards; opacity:0; }
  .l10 { animation: reveal 0s 3.2s forwards; opacity:0; }
  .l11 { animation: reveal 0s 3.3s forwards; opacity:0; }
  .l12 { animation: reveal 0s 3.9s forwards; opacity:0; }
  .l13 { animation: reveal 0s 4.4s forwards; opacity:0; }
  .l14 { animation: reveal 0s 4.6s forwards; opacity:0; }
  @keyframes reveal { to { opacity:1; } }

  .scanline {
    fill: none;
    stroke: rgba(0,255,136,0.06);
    stroke-width: 2;
    animation: scan 3s linear infinite;
    animation-delay: 4.5s;
    opacity: 0;
  }
  @keyframes scan {
    0%   { transform: translateY(-420px); opacity:1; }
    95%  { opacity:1; }
    100% { transform: translateY(420px); opacity:0; }
  }

  .glitch1 {
    opacity: 0;
    animation: glitch1 0.15s 4.5s steps(1) forwards;
  }
  .glitch2 {
    opacity: 0;
    animation: glitch2 0.15s 4.55s steps(1) forwards;
  }
  @keyframes glitch1 {
    0%  { opacity:1; transform: translateX(4px); fill:#ff0055; }
    50% { opacity:1; transform: translateX(-3px); fill:#00eeff; }
    100%{ opacity:0; transform: translateX(0); }
  }
  @keyframes glitch2 {
    0%  { opacity:1; transform: translateX(-4px); fill:#00eeff; }
    50% { opacity:1; transform: translateX(2px); fill:#ff0055; }
    100%{ opacity:0; transform: translateX(0); }
  }
</style>

<!-- Fondo -->
<rect class="bg" width="680" height="420" rx="12"/>
<rect class="topbar" x="0" y="0" width="680" height="38" rx="12"/>
<rect class="topbar" x="0" y="20" width="680" height="18"/>

<!-- Dots -->
<circle class="dot-r" cx="20" cy="19" r="6"/>
<circle class="dot-y" cx="40" cy="19" r="6"/>
<circle class="dot-g" cx="60" cy="19" r="6"/>
<text class="bar-label" x="340" y="24" text-anchor="middle">mateo@castro.dev ~ zsh</text>

<!-- Líneas de terminal -->
<text class="g l1"  x="24" y="70">$ whoami</text>
<text class="w l2"  x="24" y="96">mateo castro — full-stack developer</text>

<text class="g l3"  x="24" y="136">$ cat stack.txt</text>
<text class="c l4"  x="24" y="162">.NET 8  ·  Spring Boot  ·  React  ·  TypeScript</text>
<text class="c l5"  x="24" y="184">PostgreSQL  ·  SignalR  ·  Docker  ·  Railway</text>

<text class="g l6"  x="24" y="224">$ ls projects/</text>
<text class="w l7"  x="24" y="250">SplitEat/   Nexly/   ApiFichajes/   NexArch/</text>

<text class="g l8"  x="24" y="290">$ curl mateocastro.dev</text>
<text class="d l9"  x="24" y="316">&gt; loading portfolio...</text>
<text class="ok l10" x="24" y="338">&gt; status: 200 OK ✓</text>

<text class="g l11" x="24" y="368">$ git log --oneline -1</text>
<text class="w l12" x="24" y="394">a3f9c12 feat: life is a side project 🚀</text>

<!-- Glitch duplicates -->
<text class="g glitch1" x="24" y="394">a3f9c12 feat: life is a side project 🚀</text>
<text class="d glitch2" x="24" y="316">&gt; loading portfolio...</text>

<!-- Scanline -->
<line class="scanline" x1="0" y1="0" x2="680" y2="0"/>

<!-- Cursor parpadeante -->
<rect class="cursor" x="24" y="408" width="9" height="16" rx="1"/>
<text class="g l14" x="24" y="422">$ _</text>

</svg>
